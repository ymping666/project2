<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive browsing-context checks</title><style>body{font:14px/1.6 system-ui;margin:16px;background:#eeefe7;color:#26382f}button{padding:12px;background:#26382f;color:#fff;border:0;border-radius:5px}iframe{display:block;border:0;background:white;margin:16px 0;max-width:none;height:900px}pre{white-space:pre-wrap;font-size:11px}</style><h1>Responsive layout checks</h1><p>Actual same-origin iframe browsing contexts, each with its own viewport and production CSS. No style overrides inside the site.</p><button id="run">Check 360 / 390 / 750 px layouts</button><p id="status" role="status">Not run</p><iframe id="frame" title="Production site at the requested viewport"></iframe><details><summary>Measurements</summary><pre id="result">Not run</pre></details><script>
const paths=['/project2/','/project2/guitar/chords/f-sharp/major7/','/project2/ukulele/chords/b-flat/diminished/','/project2/piano/chords/d-flat/sus4/','/project2/guitar/scales/a/harmonic-minor/','/project2/ukulele/scales/b-flat/melodic-minor/','/project2/piano/scales/f-sharp/major-pentatonic/'];
document.getElementById('run').onclick=async()=>{
 const button=document.getElementById('run'),frame=document.getElementById('frame'),status=document.getElementById('status'),results=[];button.disabled=true;status.textContent='Checking real layouts…';
 try{
  for(const width of [360,390,750])for(const route of paths){frame.style.width=width+'px';await new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=reject;frame.src=route;});await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
   const doc=frame.contentDocument,view=doc.documentElement;const result={requested_width:width,path:route,client_width:view.clientWidth,scroll_width:view.scrollWidth,h1:doc.querySelector('h1')?.textContent,diagrams:doc.querySelectorAll('svg[role="img"]').length,pass:view.clientWidth<=width&&view.scrollWidth<=view.clientWidth+1};results.push(result);
  }
  const report={method:'Actual iframe browsing contexts load unmodified Pages HTML, CSS and JS at explicit CSS widths; layout measured after load and two animation frames. Not physical phone evidence.',results,pass:results.every(x=>x.pass)};document.getElementById('result').textContent=JSON.stringify(report,null,2);status.textContent=report.pass?'All 21 layout checks passed':'Layout overflow found';
 }catch(error){document.getElementById('result').textContent=JSON.stringify({error:String(error)});status.textContent='Responsive check error';}finally{button.disabled=false;}
};
</script></html>
